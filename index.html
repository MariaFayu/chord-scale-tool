        const letter = name[0];

        for (let i = 1; i < name.length; i++) {
            if (name[i] === '#') accidental++;
            else if (name[i] === 'b') accidental--;
        }
        return { letter, accidental };

    function pitchClassOf(name) {
        const { letter, accidental } = parseNoteName(name);
        return ((LETTER_SEMITONES[letter] + accidental) % 12 + 12) % 12;

        const root = parseNoteName(rootName);
        const rootLetterIdx = LETTERS.indexOf(root.letter);
        const targetLetterIdx = ((rootLetterIdx + letterOffset) % 7 + 7) % 7;
        const targetLetter = LETTERS[targetLetterIdx];
        const rootSemitone = pitchClassOf(rootName);
        const targetSemitone = ((rootSemitone + semitones) % 12 + 12) % 12;
        const naturalSemitone = LETTER_SEMITONES[targetLetter];
        let acc = ((targetSemitone - naturalSemitone) % 12 + 12) % 12;
        if (acc > 6) acc -= 12;
        let name = targetLetter;
        if (acc === 1) name += '#';
        else if (acc === 2) name += '##';
        else if (acc === 3) name += '###';
        else if (acc === -1) name += 'b';
        else if (acc === -2) name += 'bb';
        else if (acc === -3) name += 'bbb';
        return name;

            const name = spellNote(rootName, letterOffsets[i], iv);

    function getFretPositions(maxFret, startX, totalWidth) {
        const positions = [startX];
        const scaleLength = totalWidth / (1 - Math.pow(2, -maxFret / 12));
        for (let i = 1; i <= maxFret; i++) {
            const dist = scaleLength * (1 - Math.pow(2, -i / 12));
            positions.push(startX + dist);
        }
        return positions;
    }

    // ==================== 调内级数 ====================
    function getChordDegree(chordKey, chordRootPC, keyRootPC) {
        const dist = ((chordRootPC - keyRootPC) % 12 + 12) % 12;
        const degreeMap = {
            0:  { roman: 'I',   acc: ''  }, 1:  { roman: 'II',  acc: 'b' },
            2:  { roman: 'II',  acc: ''  }, 3:  { roman: 'III', acc: 'b' },
            4:  { roman: 'III', acc: ''  }, 5:  { roman: 'IV',  acc: ''  },
            6:  { roman: 'IV',  acc: '#' }, 7:  { roman: 'V',   acc: ''  },
            8:  { roman: 'VI',  acc: 'b' }, 9:  { roman: 'VI',  acc: ''  },
            10: { roman: 'VII', acc: 'b' }, 11: { roman: 'VII', acc: ''  }
        };
        const info = degreeMap[dist];
        if (!info) return { text: '?', inKey: false };
        const intervals = CHORDS[chordKey].intervals;
        const hasMinor3 = intervals.includes(3);
        let roman = info.roman;
        if (hasMinor3) roman = roman.toLowerCase();
        if (chordKey === 'dim' || chordKey === 'dim7') roman += '°';
        else if (chordKey === 'm7b5') roman += 'ø';
        else if (chordKey === 'aug' || chordKey === 'aug7' || chordKey === 'maj7#5') roman += '+';
        let suffix = '';
        switch (chordKey) {
            case 'major': case 'minor': case 'aug': case 'dim': break;
            case 'power5': suffix = '5'; break;
            case 'sus2': suffix = 'sus2'; break;
            case 'sus4': suffix = 'sus4'; break;
            case 'add2': suffix = 'add2'; break;
            case 'add4': suffix = 'add4'; break;
            case 'add9': suffix = 'add9'; break;
            case 'madd9': suffix = 'add9'; break;
            case 'six': case 'm6': suffix = '6'; break;
            case '6/9': case 'm6/9': suffix = '6/9'; break;
            case '7': case 'min7': case 'dim7': case 'm7b5': case 'aug7': case 'maj7#5': case '7b5': suffix = '7'; break;
            case 'maj7': suffix = 'maj7'; break;
            case '7sus2': suffix = '7sus2'; break;
            case '7sus4': suffix = '7sus4'; break;
            case 'nine': case 'min9': suffix = '9'; break;
            case 'maj9': suffix = 'maj9'; break;
            case '7b9': suffix = '7b9'; break;
            case '7#9': suffix = '7#9'; break;
            case 'eleven': suffix = '11'; break;
            case 'm11': suffix = '11'; break;
            case '7#11': suffix = '7#11'; break;
            case 'thirteen': suffix = '13'; break;
            case 'm13': suffix = '13'; break;
            case 'maj13': suffix = '13'; break;
            case '7b13': suffix = '7b13'; break;
        }
        const text = info.acc + roman + suffix;
        const majorScale = [0,2,4,5,7,9,11];
        const inKey = majorScale.includes(dist);
        return { text, inKey };
    }

    // ==================== 顺阶和弦 ====================
    function identifyChordKey(intervals) {
        const key = intervals.join(',');
        const map = {
            '0,4,7': 'major', '0,3,7': 'minor', '0,4,8': 'aug', '0,3,6': 'dim',
            '0,4,7,11': 'maj7', '0,4,7,10': '7', '0,3,7,10': 'min7',
            '0,3,6,10': 'm7b5', '0,3,6,9': 'dim7', '0,4,8,10': 'aug7',
            '0,4,8,11': 'maj7#5', '0,5,7,10': '7sus4'
        };
        return map[key] || null;
    }
    function romanNumeralForDiatonic(degreeIdx, intervals) {
        const romans = ['I','II','III','IV','V','VI','VII'];
        const r = romans[degreeIdx];
        const third = intervals[1];
        const fifth = intervals[2];
        const seventh = intervals[3];
        let base = (third === 3) ? r.toLowerCase() : r;
        if (intervals.length === 3) {
            if (fifth === 6) base += '°';
            else if (fifth === 8) base += '+';
            return base;
        }
        if (fifth === 6 && seventh === 9) return base + '°7';
        if (fifth === 6 && seventh === 10) return base + 'ø7';
        if (fifth === 8 && seventh === 10) return base + '+7';
        if (seventh === 11) return base + 'maj7';
        if (seventh === 10) return base + '7';
        return base;
    }
    function getDiatonicChords(scaleKey, rootName) {
        const scale = SCALES[scaleKey];
        const intervals = scale.intervals;
        const N = intervals.length;
        const rootPC = pitchClassOf(rootName);
        const spelling = buildSpellingMap(rootName, intervals, scale.letterOffsets);
        const abs = [];
        for (let oct = 0; oct < 3; oct++) {
            for (const iv of intervals) abs.push(iv + oct * 12);
        }
        const result = [];
        for (let i = 0; i < N; i++) {
            const rootIv = abs[i];
            const thirdIv = abs[i + 2] - rootIv;
            const fifthIv = abs[i + 4] - rootIv;
            const seventhIv = abs[i + 6] - rootIv;
            const chordRootPC = (rootPC + intervals[i]) % 12;
            const useSeventh = seventhIv === 9 || seventhIv === 10 || seventhIv === 11;
            const intervalsToUse = useSeventh
                ? [0, thirdIv, fifthIv, seventhIv]
                : [0, thirdIv, fifthIv];
            const noteNames = intervalsToUse.map(iv => {
                const pc = (chordRootPC + iv) % 12;
                return spelling[pc] || NOTE_NAMES[pc];
            });
            const chordKey = identifyChordKey(intervalsToUse);
            const roman = romanNumeralForDiatonic(i, intervalsToUse);
            const chordRootName = spelling[chordRootPC] || NOTE_NAMES[chordRootPC];
            const symbol = chordRootName + (chordKey ? CHORDS[chordKey].symbol : '');
            result.push({
                index: i, roman, chordKey, chordRootName, chordRootPC,
                intervals: intervalsToUse, noteNames, symbol
            });
        }
        return result;
    }

                const midisBottomToTop  = isBass ? [40,45,50,55]   : [40,45,50,55,59,64];
                const tuningIndices     = labelsBottomToTop.map(n => pitchClassOf(n));
                const stringCount       = labelsBottomToTop.length;
                const maxFret = this.maxFret;
                const fretPos = getFretPositions(maxFret, 36, 680);
                const nut = document.createElement('div');
                nut.className = 'fret-line nut';
                fb.appendChild(nut);
                for (let i = 1; i <= maxFret; i++) {
                    const line = document.createElement('div');
                    line.className = 'fret-line';
                    line.style.left = `${fretPos[i]}px`;
                    fb.appendChild(line);
                    const num = document.createElement('div');
                    num.className = 'fret-number';
                    num.textContent = i;
                    num.style.left = `${fretPos[i]}px`;
                    fb.appendChild(num);
                }
                this.markerFrets.forEach(f => {
                    if (f > maxFret) return;
                    const cx = (fretPos[f - 1] + fretPos[f]) / 2;
                    if (f === 12) {
                        [35, 65].forEach(pct => {
                            const dot = document.createElement('div');
                            dot.className = 'fret-marker double';
                            dot.style.left = `${cx}px`;
                            dot.style.top = `${pct}%`;
                            fb.appendChild(dot);

                        dot.className = 'fret-marker';
                        dot.style.left = `${cx}px`;
                        dot.style.top = '50%';
                        fb.appendChild(dot);
                    }
                });
                labelsBottomToTop.forEach((label, si) => {
                    const str = document.createElement('div');
                    str.className = `string string-${stringCount - si}`;
                    str.dataset.tuning = label;
                    fb.appendChild(str);
                });
                const stringTopPositions = isBass
                    ? [88, 62.67, 37.33, 12]
                    : [94, 76.4, 58.8, 41.2, 23.6, 6];
                tuningIndices.forEach((openIdx, si) => {
                    for (let f = 0; f <= maxFret; f++) {

                        if (activeNotes.has(noteIdx)) {

                            pt.onclick = (e) => { e.stopPropagation(); playTone(getFreq(midi)); };
                            pt.onkeydown = (e) => {

                                    e.stopPropagation();
                                    playTone(getFreq(midi));
                                }

                            fb.appendChild(pt);
                        }

            }

    // ==================== URL 状态持久化 ====================
    function syncURL() {
        const params = new URLSearchParams();
        if (currentMode !== 'chord') params.set('mode', currentMode);
        if (currentRoot !== 'C') params.set('root', currentRoot);
        const defaultType = currentMode === 'scale' ? 'major' : '7';
        if (currentType !== defaultType) params.set('type', currentType);
        if (currentKey !== 'C') params.set('key', currentKey);
        if (currentDiatonicScale !== 'major') params.set('dscale', currentDiatonicScale);
        if (currentInstrument !== 'piano') params.set('instr', currentInstrument);
        const qs = params.toString();
        const url = qs ? location.pathname + '?' + qs : location.pathname;
        try {
            history.replaceState(null, '', url);
        } catch (e) { /* 某些环境下会失败，忽略 */ }
    }

    function loadFromURL() {
        const params = new URLSearchParams(location.search);
        const mode = params.get('mode');
        const root = params.get('root');
        const type = params.get('type');
        const key = params.get('key');
        const dscale = params.get('dscale');
        const instr = params.get('instr');

        if (mode && ['chord', 'scale', 'match'].includes(mode)) currentMode = mode;
        if (root && NOTE_NAMES.includes(root)) currentRoot = root;
        if (key && NOTE_NAMES.includes(key)) currentKey = key;
        if (dscale && SCALES[dscale]) currentDiatonicScale = dscale;
        if (instr && ['piano', 'guitar', 'bass'].includes(instr)) currentInstrument = instr;

        if (type) {
            if (currentMode === 'scale') {
                if (SCALES[type]) currentType = type;
            } else {
                if (CHORDS[type]) currentType = type;
            }
        } else {
            currentType = currentMode === 'scale' ? 'major' : '7';

                { label: 'I - V - I - IV', degrees: [0,4,0,3], desc: '民谣基础进行' },
                { label: 'I - IV - vi - V', degrees: [0,3,5,4], desc: '流行民谣，情感充沛' }
            ]
        }
    ];

    function initUI() {
        // 自动填入当前年份
        const yearEl = document.getElementById('copyrightYear');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        loadFromURL();

        const rootSel = document.getElementById('rootNote');
        NOTE_NAMES.forEach(n => {
            const o = document.createElement('option');
            o.value = n; o.textContent = n;
            rootSel.appendChild(o);
        });
        rootSel.value = currentRoot;

        const keySel = document.getElementById('keySelect');
        NOTE_NAMES.forEach(n => {
            const o = document.createElement('option');
            o.value = n; o.textContent = n + ' 大调';
            keySel.appendChild(o);
        });
        keySel.value = currentKey;

        const dscaleSel = document.getElementById('diatonicScaleType');
        dscaleSel.value = currentDiatonicScale;
        dscaleSel.onchange = e => {
            currentDiatonicScale = e.target.value;
            renderDiatonicSection();
            renderProgression();
            syncURL();
        };

        keySel.onchange = e => { currentKey = e.target.value; updateApp(); };

        document.querySelectorAll('.instr-btn').forEach((b, i) => {
            b.classList.toggle('active',
                (i === 0 && currentInstrument === 'piano') ||
                (i === 1 && currentInstrument === 'guitar') ||
                (i === 2 && currentInstrument === 'bass')
            );
        });

        initPlayerUI();
        renderBeatIndicator();
        renderPresets();
        renderProgression();
        updateTypeOptions();
        rootSel.onchange = e => { currentRoot = e.target.value; updateApp(); };
        document.getElementById('typeSelect').onchange = e => { currentType = e.target.value; updateApp(); };
        updateApp();
    }

    function renderPresets() {
        const row = document.getElementById('presetRow');
        const hint = document.getElementById('presetHint');
        row.innerHTML = '';
        PROGRESSION_GROUPS.forEach(group => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'preset-group';
            const labelSpan = document.createElement('span');
            labelSpan.className = 'preset-group-label';
            labelSpan.textContent = group.label;
            const btnContainer = document.createElement('div');
            btnContainer.className = 'preset-group-buttons';
            group.presets.forEach(preset => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn';
                btn.textContent = preset.label;
                btn.title = preset.desc;
                btn.onclick = () => {
                    progression = [...preset.degrees];
                    progressionChordIndex = -1;
                    renderProgression();
                    hint.textContent = preset.desc;
                };
                btn.onmouseenter = () => { hint.textContent = preset.desc; };
                btn.onmouseleave = () => {
                    hint.textContent = '把鼠标移到预设上查看说明 · 点击即可填充进行';
                };
                btnContainer.appendChild(btn);
            });
            groupDiv.appendChild(labelSpan);
            groupDiv.appendChild(btnContainer);
            row.appendChild(groupDiv);
        });
    }

    function initPlayerUI() {
        const bpmInput = document.getElementById('bpmInput');
        bpmInput.oninput = e => {
            const v = parseInt(e.target.value);
            if (!isNaN(v) && v >= 40 && v <= 240) playerBPM = v;
        };
        bpmInput.onchange = e => {
            let v = parseInt(e.target.value);
            if (isNaN(v)) v = 100;
            v = Math.max(40, Math.min(240, v));
            e.target.value = v;
            playerBPM = v;
        };
        document.getElementById('timeSignature').onchange = e => {
            playerBeatsPerBar = parseInt(e.target.value);
            beatInBar = 0;
            renderBeatIndicator();
        };
        document.getElementById('beatsPerChordSelect').onchange = e => {
            beatsPerChord = parseInt(e.target.value);
            beatsIntoChord = 0;
            progressionChordIndex = -1;
        };
        document.getElementById('metronomeToggle').onclick = e => {
            metronomeEnabled = !metronomeEnabled;
            e.target.classList.toggle('active', metronomeEnabled);
            e.target.textContent = metronomeEnabled ? '🔔 节拍器 开' : '🔔 节拍器 关';
        };
        document.getElementById('playBtn').onclick = togglePlay;
        document.getElementById('clearProgression').onclick = () => {
            progression = [];
            progressionChordIndex = -1;
            renderProgression();
        };
    }

    function updateTypeOptions() {
        const sel = document.getElementById('typeSelect');
        const lbl = document.getElementById('typeSelectLabel');
        sel.innerHTML = '';
        const opts = currentMode === 'scale' ? SCALES : CHORDS;
        lbl.textContent = currentMode === 'scale' ? '音阶类型' : '和弦类型';
        if (!opts[currentType]) currentType = Object.keys(opts)[0];
        for (const [k, v] of Object.entries(opts)) {
            const o = document.createElement('option');
            o.value = k; o.textContent = v.name;
            sel.appendChild(o);
        }
        sel.value = currentType;
    }

    function getActiveData() {
        const rootIdx = pitchClassOf(currentRoot);
        const active = new Set();
        const chord = new Set();
        let intervals = [];
        if (currentMode === 'scale') {
            intervals = SCALES[currentType].intervals;
        } else {
            intervals = CHORDS[currentType].intervals;
        }
        intervals.forEach(iv => {
            const idx = (rootIdx + iv) % 12;
            active.add(idx);
            if (currentMode !== 'scale') chord.add(idx);
        });
        return { active, chord, rootIdx, intervals };
    }

    function getSymbolText() {
        if (currentMode === 'scale') {
            return `${currentRoot} ${SCALES[currentType].type}`;
        }
        return `${currentRoot}${CHORDS[currentType].symbol}`;
    }

    function updateApp() {
        document.querySelectorAll('.tab-btn').forEach((b, i) => {
            const active = (i === 0 && currentMode === 'chord') ||
                           (i === 1 && currentMode === 'scale') ||
                           (i === 2 && currentMode === 'match');
            b.classList.toggle('active', active);
            b.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        document.getElementById('view-chord-scale').style.display = currentMode === 'match' ? 'none' : 'block';
        document.getElementById('view-match').style.display = currentMode === 'match' ? 'block' : 'none';
        document.getElementById('keySelectGroup').style.display = currentMode === 'chord' ? 'flex' : 'none';
        document.getElementById('diatonic-section').style.display = currentMode === 'chord' ? 'block' : 'none';
        document.getElementById('player-section').style.display = currentMode === 'chord' ? 'flex' : 'none';
        updateTypeOptions();

        if (currentMode === 'scale') {
            currentSpellingMap = buildSpellingMap(currentRoot, SCALES[currentType].intervals, SCALES[currentType].letterOffsets);
        } else {
            currentSpellingMap = buildSpellingMap(currentRoot, CHORDS[currentType].intervals, CHORDS[currentType].letterOffsets);
        }

        const { active, chord, rootIdx, intervals } = getActiveData();
        let title = '', btnText = '', subInfo = '', notesHTML = '';
        if (currentMode === 'chord' || currentMode === 'match') {
            title = `${currentRoot} ${CHORDS[currentType].name}`;
            btnText = '试听和弦';
            intervals.forEach(iv => {
                const ni = (rootIdx + iv) % 12;
                notesHTML += `<div class="note-tag active"><span class="note-name">${getNoteName(ni)}</span><span class="note-sub">${getIntervalName(iv)}</span></div>`;
            });
        } else {
            const sd = SCALES[currentType];
            title = `${currentRoot} ${sd.name}`;
            btnText = '试听音阶';
            subInfo = `${sd.type}`;
            intervals.forEach((iv, i) => {
                const ni = (rootIdx + iv) % 12;
                notesHTML += `<div class="note-tag active"><span class="note-name">${getNoteName(ni)}</span><span class="note-sub">${getIntervalName(iv)} · ${i+1}</span></div>`;
            });
        }
        document.getElementById('resultTitle').textContent = title;
        document.getElementById('playBtnText').textContent = btnText;
        document.getElementById('resultSubInfo').textContent = subInfo;
        document.getElementById('notesDisplay').innerHTML = notesHTML;

        const badge = document.getElementById('symbolBadge');
        badge.textContent = getSymbolText();
        badge.title = `点击复制：${getSymbolText()}`;
        badge.onclick = () => {
            const txt = getSymbolText();
            navigator.clipboard?.writeText(txt).then(() => {
                const old = badge.textContent;
                badge.textContent = '已复制 ✓';
                setTimeout(() => badge.textContent = old, 900);
            }).catch(() => {});
        };

        const degreeBadge = document.getElementById('degreeBadge');
        if (currentMode === 'chord') {
            const chordRootPC = pitchClassOf(currentRoot);
            const keyRootPC = pitchClassOf(currentKey);
            const deg = getChordDegree(currentType, chordRootPC, keyRootPC);
            degreeBadge.textContent = deg.text;
            degreeBadge.title = `在 ${currentKey} 大调中：${deg.inKey ? '调内和弦' : '变音和弦'}`;
            degreeBadge.classList.toggle('out-of-key', !deg.inKey);
            degreeBadge.classList.remove('hidden');
        } else {
            degreeBadge.classList.add('hidden');
        }

        if (currentMode === 'chord') {
            renderDiatonicSection();
            renderProgression();
        }
        if (currentMode === 'match') renderMatchList(rootIdx, CHORDS[currentType].intervals);
        if (!playerRunning) {
            renderInstrument(active, chord, rootIdx);
        }
        syncURL();
    }

    function renderDiatonicSection() {
        const list = document.getElementById('diatonicList');
        const subtitle = document.getElementById('diatonicSubtitle');
        const scaleInfo = SCALES[currentDiatonicScale];
        subtitle.textContent = `${currentKey} ${scaleInfo.name}`;
        const chords = getDiatonicChords(currentDiatonicScale, currentKey);
        list.innerHTML = '';
        chords.forEach(dc => {
            const card = document.createElement('div');
            card.className = 'diatonic-card';
            if (dc.chordRootPC === pitchClassOf(currentRoot) && dc.chordKey === currentType) {
                card.classList.add('active');
            }
            card.innerHTML = `<div class="degree">${dc.roman}</div><div class="symbol">${dc.symbol}</div><div class="notes">${dc.noteNames.join(' ')}</div>`;
            const addBtn = document.createElement('button');
            addBtn.className = 'diatonic-add-btn';
            addBtn.textContent = '+';
            addBtn.title = '加入和弦进行';
            addBtn.setAttribute('aria-label', `把 ${dc.symbol} 加入和弦进行`);
            addBtn.onclick = (e) => {
                e.stopPropagation();
                progression.push(dc.index);
                renderProgression();
            };
            card.appendChild(addBtn);
            card.onclick = () => {
                currentRoot = NOTE_NAMES[dc.chordRootPC];
                if (dc.chordKey && CHORDS[dc.chordKey]) {
                    currentType = dc.chordKey;
                    document.getElementById('rootNote').value = currentRoot;
                    updateApp();
                } else {
                    document.getElementById('rootNote').value = currentRoot;
                    updateApp();
                }
                dc.intervals.forEach((iv, i) => {
                    const midi = 60 + dc.chordRootPC + iv;
                    setTimeout(() => playTone(getFreq(midi)), i * 150);
                });
            };
            list.appendChild(card);
        });
    }

    function renderProgression() {
        const list = document.getElementById('progressionList');
        const diatonic = getDiatonicChords(currentDiatonicScale, currentKey);
        list.innerHTML = '';
        if (progression.length === 0) {
            list.innerHTML = '<span style="color:#9ca3af;font-size:11px;">点击顺阶和弦卡片的 + 号加入进行，或选择下方预设</span>';
            return;
        }
        if (progressionChordIndex >= progression.length) progressionChordIndex = -1;
        progression.forEach((degIdx, i) => {
            const chord = diatonic[degIdx];
            if (!chord) return;
            const chip = document.createElement('span');
            chip.className = 'progression-chip';
            if (i === progressionChordIndex) chip.classList.add('playing');
            chip.innerHTML = `<span class="chip-roman">${chord.roman}</span><span class="chip-symbol">${chord.symbol}</span><button class="chip-remove" title="移除">×</button>`;
            chip.querySelector('.chip-remove').onclick = (e) => {
                e.stopPropagation();
                progression.splice(i, 1);
                if (progressionChordIndex >= progression.length) progressionChordIndex = -1;
                renderProgression();
            };
            list.appendChild(chip);
        });
    }

    function renderMatchList(rootIdx, chordIntervals) {
        const list = document.getElementById('matchList');
        list.innerHTML = '';
        for (const [sKey, sData] of Object.entries(SCALES)) {
            let matched = 0, missing = [];
            chordIntervals.forEach(ci => {
                const cn = (rootIdx + ci) % 12;
                if (sData.intervals.some(si => (rootIdx + si) % 12 === cn)) matched++;
                else missing.push(cn);
            });
            if (matched === chordIntervals.length || missing.length <= 1) {
                const item = document.createElement('div');
                item.className = 'match-item';
                const header = document.createElement('div');
                header.className = 'match-header';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'match-title';
                titleDiv.innerHTML = `${currentRoot} ${sData.name}<span class="match-title-sub">${sData.type}</span>`;
                const rate = document.createElement('div');
                rate.className = `match-rate ${matched === chordIntervals.length ? 'success' : ''}`;
                rate.textContent = matched === chordIntervals.length
                    ? `✓ 全部匹配 ${matched}/${chordIntervals.length}`
                    : `缺${missing.length}音 ${matched}/${chordIntervals.length}`;
                const playBtn = document.createElement('button');
                playBtn.className = 'play-btn';
                playBtn.style.padding = '3px 10px';
                playBtn.style.marginLeft = '0';
                playBtn.setAttribute('aria-label', `试听 ${currentRoot} ${sData.name}`);
                playBtn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`;
                playBtn.onclick = () => {
                    sData.intervals.forEach((iv, i) => {
                        const midi = 60 + pitchClassOf(currentRoot) + iv;
                        setTimeout(() => playTone(getFreq(midi)), i * 180);
                    });
                };
                header.append(titleDiv, rate, playBtn);
                item.appendChild(header);
                const sSpelling = buildSpellingMap(currentRoot, sData.intervals, sData.letterOffsets);
                const nc = document.createElement('div');
                nc.className = 'notes-display';
                sData.intervals.forEach((iv, i) => {
                    const ni = (rootIdx + iv) % 12;
                    const isMiss = missing.includes(ni);
                    const tag = document.createElement('div');
                    tag.className = `note-tag ${isMiss ? 'missing' : 'active'}`;
                    const name = sSpelling[ni] || NOTE_NAMES[ni];
                    tag.innerHTML = `<span class="note-name">${name}</span><span class="note-sub">${getIntervalName(iv)} · ${i+1}</span>`;
                    nc.appendChild(tag);
                });
                item.appendChild(nc);
                list.appendChild(item);
            }
        }
    }

    function renderInstrument(active, chord, rootIdx) {
        const container = document.getElementById('instrument-view');
        container.innerHTML = '';
        container.appendChild(INSTRUMENTS[currentInstrument].render(active, chord, rootIdx));
        const tips = {
            piano: '点击琴键可试听单音 · C2–B4',
            guitar: '点击圆点试听 · 红=根音 橙=和弦音 蓝=音阶音 · 0–12品',
            bass: '点击圆点试听 · 标准调弦 E A D G · 0–12品'
        };
        const tipText = document.getElementById('tipText');
        tipText.textContent = tips[currentInstrument];
    }

    function playCurrentMode() {
        const { rootIdx, intervals } = getActiveData();
        intervals.forEach((iv, i) => {
            const midi = 48 + rootIdx + iv;
            setTimeout(() => playTone(getFreq(midi)), i * 150);
        });
    }

    function syncInstrumentToPlayingChord() {
        const diatonic = getDiatonicChords(currentDiatonicScale, currentKey);
        const chord = diatonic[progression[progressionChordIndex]];
        if (!chord) return;
        if (savedSpellingMap === null) {
            savedSpellingMap = currentSpellingMap;
        }
        const chordRootName = NOTE_NAMES[chord.chordRootPC];
        if (chord.chordKey && CHORDS[chord.chordKey]) {
            currentSpellingMap = buildSpellingMap(
                chordRootName,
                CHORDS[chord.chordKey].intervals,
                CHORDS[chord.chordKey].letterOffsets
            );
        } else {
            currentSpellingMap = {};
        }
        const active = new Set();
        const chordSet = new Set();
        chord.intervals.forEach(iv => {
            const idx = (chord.chordRootPC + iv) % 12;
            active.add(idx);
            chordSet.add(idx);
        });
        renderInstrument(active, chordSet, chord.chordRootPC);
        const tipText = document.getElementById('tipText');
        tipText.textContent = `🎵 正在播放：${chord.symbol}  (${chord.roman})`;
        tipText.classList.add('playing');
    }

    function restoreInstrumentFromUserSelection() {
        if (savedSpellingMap !== null) {
            currentSpellingMap = savedSpellingMap;
            savedSpellingMap = null;
        }
        if (currentMode === 'scale') {
            currentSpellingMap = buildSpellingMap(currentRoot, SCALES[currentType].intervals, SCALES[currentType].letterOffsets);
        } else {
            currentSpellingMap = buildSpellingMap(currentRoot, CHORDS[currentType].intervals, CHORDS[currentType].letterOffsets);
        }
        const { active, chord, rootIdx } = getActiveData();
        renderInstrument(active, chord, rootIdx);
        const tips = {
            piano: '点击琴键可试听单音 · C2–B4',
            guitar: '点击圆点试听 · 红=根音 橙=和弦音 蓝=音阶音 · 0–12品',
            bass: '点击圆点试听 · 标准调弦 E A D G · 0–12品'
        };
        const tipText = document.getElementById('tipText');
        tipText.textContent = tips[currentInstrument];
        tipText.classList.remove('playing');
    }

    function togglePlay() {
        if (playerRunning) stopPlayer();
        else startPlayer();
    }
    function startPlayer() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playerRunning = true;
        nextBeatTime = audioCtx.currentTime + 0.06;
        beatInBar = 0;
        beatsIntoChord = 0;
        progressionChordIndex = -1;
        updatePlayButton();
        scheduleLoop();
    }
    function stopPlayer() {
        playerRunning = false;
        if (scheduleTimer) { clearTimeout(scheduleTimer); scheduleTimer = null; }
        updatePlayButton();
        clearBeatVisual();
        clearProgressionHighlight();
        progressionChordIndex = -1;
        if (currentMode === 'chord') {
            restoreInstrumentFromUserSelection();
        }
    }
    function updatePlayButton() {
        const btn = document.getElementById('playBtn');
        if (!btn) return;
        btn.textContent = playerRunning ? '⏹ 停止' : '▶ 播放';
        btn.classList.toggle('playing', playerRunning);
    }
    function scheduleLoop() {
        if (!playerRunning) return;
        const now = audioCtx.currentTime;
        while (nextBeatTime < now + 0.15) {
            const beat = beatInBar;
            const time = nextBeatTime;
            const delay = Math.max(0, (time - now) * 1000);
            if (metronomeEnabled) scheduleClickAt(time, beat === 0);
            setTimeout(() => {
                if (!playerRunning) return;
                updateBeatVisual(beat);
                if (progression.length > 0) {
                    if (beatsIntoChord === 0) {
                        progressionChordIndex = (progressionChordIndex + 1) % progression.length;
                        playProgressionChord();
                        highlightCurrentProgression();
                        syncInstrumentToPlayingChord();
                    }
                    beatsIntoChord = (beatsIntoChord + 1) % beatsPerChord;
                }
            }, delay);
            nextBeatTime += 60.0 / playerBPM;
            beatInBar = (beatInBar + 1) % playerBeatsPerBar;
        }
        scheduleTimer = setTimeout(scheduleLoop, 50);
    }
    function scheduleClickAt(time, isDownbeat) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = isDownbeat ? 1100 : 800;
        osc.type = 'square';
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(0.13, time + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.onended = () => {
            try { osc.disconnect(); gain.disconnect(); } catch (e) {}
        };
        osc.start(time);
        osc.stop(time + 0.06);
    }
    function updateBeatVisual(beat) {
        document.querySelectorAll('.beat-dot').forEach((d, i) => {
            d.classList.toggle('active', i === beat);
        });
    }
    function clearBeatVisual() {
        document.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('active'));
    }
    function playProgressionChord() {
        const diatonic = getDiatonicChords(currentDiatonicScale, currentKey);
        const chord = diatonic[progression[progressionChordIndex]];
        if (!chord) return;
        const chordDuration = (60 / playerBPM) * beatsPerChord;
        const baseMidi = 48;
        chord.intervals.forEach(iv => {
            const midi = baseMidi + chord.chordRootPC + iv;
            playTone(getFreq(midi), Math.max(0.3, chordDuration * 0.9));
        });
    }
    function highlightCurrentProgression() {
        document.querySelectorAll('.diatonic-card').forEach(c => c.classList.remove('playing'));
        document.querySelectorAll('.progression-chip').forEach(c => c.classList.remove('playing'));
        if (progressionChordIndex < 0 || progression.length === 0) return;
        const degIdx = progression[progressionChordIndex];
        const diatonicCards = document.querySelectorAll('.diatonic-card');
        if (diatonicCards[degIdx]) diatonicCards[degIdx].classList.add('playing');
        const chips = document.querySelectorAll('.progression-chip');
        if (chips[progressionChordIndex]) chips[progressionChordIndex].classList.add('playing');
    }
    function clearProgressionHighlight() {
        document.querySelectorAll('.diatonic-card').forEach(c => c.classList.remove('playing'));
        document.querySelectorAll('.progression-chip').forEach(c => c.classList.remove('playing'));
    }
    function renderBeatIndicator() {
        const container = document.getElementById('beatIndicator');
        container.innerHTML = '';
        for (let i = 0; i < playerBeatsPerBar; i++) {
            const dot = document.createElement('span');
            dot.className = 'beat-dot' + (i === 0 ? ' downbeat' : '');
            container.appendChild(dot);
        }
    }

    window.switchTab = mode => {
        currentMode = mode;
        if (mode !== 'chord' && playerRunning) stopPlayer();
        updateApp();
    };
    window.setInstrument = instr => {
        currentInstrument = instr;
        document.querySelectorAll('.instr-btn').forEach((b, i) => {
            b.classList.toggle('active',
                (i === 0 && instr === 'piano') ||
                (i === 1 && instr === 'guitar') ||
                (i === 2 && instr === 'bass')
            );
        });
        updateApp();
    };

    initUI();
</script>
</body>
